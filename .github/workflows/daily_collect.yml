name: 매일 후보 큐 수집 (scorecard)

on:
  schedule:
    - cron: '30 23 * * *'   # 08:30 KST — daily_post.yml(09:17 KST)보다 먼저 후보 큐를 갱신
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests python-dotenv

      - name: .env 파일 생성
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "DATA_GO_KR_KEY=${{ secrets.DATA_GO_KR_KEY }}"  >> .env

      - name: 후보 큐 수집 실행 (scorecard.py)
        run: python scorecard.py

      - name: 후보 큐 커밋백
        run: |
          git config user.name  "후보 큐 자동 수집"
          git config user.email "pride93d@gmail.com"
          # gov24_cache.json / gov24_quota.json은 .gitignore로 커밋 대상에서 제외됨(전량 캐시·쿼터,
          # 재생성 가능이라 커밋 불필요). candidates.json/gov24_snapshot.json/source_health.json만
          # admin 후보 큐가 읽을 수 있게 커밋백한다.
          git add posts/candidates.json posts/gov24_snapshot.json posts/source_health.json
          git diff --staged --quiet && echo "변경 없음, 종료" && exit 0
          git commit -m "후보 큐 자동 수집: $(date +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && echo "push 성공 (시도 $i)" && exit 0
            echo "push 재시도 $i 실패, 재시도..."
            sleep 3
          done
          echo "5회 재시도 후에도 push 실패" && exit 1
